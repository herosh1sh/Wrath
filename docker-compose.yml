version: '3.8'

services:
  # Reverse proxy with SSL
  nginx:
    image: nginx:alpine
    container_name: wrath-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    networks:
      - wrath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wrath-frontend
    expose:
      - "80"
    volumes:
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    networks:
      - wrath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend (Node.js + Express + Socket.io)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wrath-backend
    expose:
      - "3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=https://wrath.heroshish.ru
    volumes:
      - wrath-data:/app/data
      - wrath-uploads:/app/uploads
    networks:
      - wrath-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for Let's Encrypt (optional, if not using reg.ru certs)
  certbot:
    image: certbot/certbot
    container_name: wrath-certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"
    networks:
      - wrath-network
    restart: unless-stopped

volumes:
  wrath-data:
    driver: local
  wrath-uploads:
    driver: local

networks:
  wrath-network:
    driver: bridge